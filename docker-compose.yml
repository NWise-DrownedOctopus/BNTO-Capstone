services:
  postgres:
    image: postgres:16
    container_name: bnto-postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bnto
      POSTGRES_USER: bnto_user
      POSTGRES_PASSWORD: bnto_pass
    ports:
      - "5432:5432"
    volumes:
      - bnto_pgdata:/var/lib/postgresql/data

volumes:
  bnto_pgdata: