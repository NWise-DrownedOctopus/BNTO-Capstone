spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:bnto}
spring.datasource.username=${POSTGRES_USER:bnto_user}
spring.datasource.password=${POSTGRES_PASSWORD:bnto_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:1.7b}

# Frontend origins allowed to call the API from a browser (comma-separated, exact matches).
# Default: the deployed Vercel site + the local Vite dev server. Override with CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-ten-chi-hxiv0m6g7l.vercel.app,http://localhost:8443}