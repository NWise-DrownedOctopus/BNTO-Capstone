# Test configuration. On the test classpath this file shadows src/main/resources/application.properties,
# so every property the app needs must be repeated here. Lets @SpringBootTest run without Postgres,
# Docker, or a .env file (e.g. in CI).

spring.application.name=backend

# In-memory H2 in PostgreSQL compatibility mode; schema is created from the entities on each run.
spring.datasource.url=jdbc:h2:mem:bnto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# TEST-ONLY signing key (base64 of "test-only-jwt-secret-not-for-prod!", 34 bytes). Never use outside tests.
# A real JWT_SECRET environment variable still takes precedence over this.
JWT_SECRET=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1wcm9kIQ==

# OllamaService needs these to start; no test calls Ollama.
ollama.base-url=http://localhost:11434
ollama.model=qwen3:1.7b
